<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Upload Image</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            color: #222;
        }

        .container {
            width: 100%;
            max-width: 600px;
            padding: 40px;
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
        }

        h1 {
            margin-top: 0;
            text-align: center;
        }

        .description {
            margin-bottom: 25px;
            text-align: center;
            color: #666;
        }

        .upload-form {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        input[type="file"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 6px;
        }

        .button {
            padding: 12px 20px;
            border: 0;
            border-radius: 6px;
            background: #2b90cc;
            color: #ffffff;
            font-size: 16px;
            cursor: pointer;
        }

        .button:hover {
            opacity: 0.85;
        }

        .info {
            padding: 15px;
            border-radius: 6px;
            background: #f4f6f8;
            color: #666;
            font-size: 14px;
        }

        .result {
            display: none;
            margin-top: 20px;
            padding: 15px;
            border-radius: 6px;
            background: #eaf7ee;
            color: #256b3a;
        }

        .result a {
            display: block;
            margin-top: 8px;
            color: #2b90cc;
            word-break: break-all;
        }

        .navigation {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .navigation a {
            flex: 1;
            padding: 12px 10px;
            border-radius: 6px;
            background: #2b90cc;
            color: #ffffff;
            text-align: center;
            text-decoration: none;
        }

        .navigation a:hover {
            opacity: 0.85;
        }
    </style>
</head>

<body>

    <main class="container">

        <h1>Upload Image</h1>

        <p class="description">
            Select an image to upload to the server.
        </p>

        <form class="upload-form" action="/upload" method="post" enctype="multipart/form-data">

            <input
                type="file"
                name="image"
                accept=".jpg,.png,.gif"
                required
            >

            <div class="info">
                Allowed formats: JPG, PNG, GIF<br>
                Maximum size: 5 MB
            </div>

            <button class="button" type="submit">
                Upload
            </button>

        </form>

        <div class="result" id="upload-result">
            <strong>File uploaded successfully</strong>
            <a id="image-link" href="" target="_blank"></a>
        </div>

        <div class="navigation">
            <a href="/">
                ← Back to Home
            </a>

            <a href="/images/">
                View Images
            </a>
        </div>

    </main>

    <script>
        const form = document.querySelector(".upload-form");
        const result = document.querySelector("#upload-result");
        const imageLink = document.querySelector("#image-link");

        form.addEventListener("submit", async function (event) {
            event.preventDefault();

            const formData = new FormData(form);

            const response = await fetch("/upload", {
                method: "POST",
                body: formData
            });

            const text = await response.text();

            if (response.ok) {
                const lines = text.trim().split("\n");
                const filename = lines[lines.length - 1].split("/").pop();

                const imageUrl = "/images/" + filename;

                imageLink.href = imageUrl;
                imageLink.textContent = window.location.origin + imageUrl;

                result.style.display = "block";
            } else {
                result.style.display = "block";
                result.style.background = "#fdecec";
                result.style.color = "#a33";

                imageLink.removeAttribute("href");
                imageLink.textContent = text;
            }
        });
    </script>

</body>
</html>
