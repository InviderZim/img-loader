<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Зображення</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            color: #222;
        }

        .container {
            width: 100%;
            max-width: 1100px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        h1 {
            margin: 0 0 10px;
            text-align: center;
        }

        .description {
            margin: 0 0 30px;
            text-align: center;
            color: #666;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 20px;
        }

        .image-card {
            overflow: hidden;
            background: #ffffff;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
        }

        .image-card a {
            display: block;
        }

        .image-card img {
            display: block;
            width: 100%;
            height: 220px;
            object-fit: cover;
        }

        .image-name {
            padding: 12px;
            font-size: 14px;
            color: #555;
            word-break: break-all;
        }

        .navigation {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 30px;
        }

        .button {
            display: inline-block;
            padding: 12px 20px;
            border-radius: 6px;
            background: #2b90cc;
            color: #ffffff;
            text-decoration: none;
        }

        .button:hover {
            opacity: 0.85;
        }
    </style>
</head>

<body>

    <main class="container">

        <h1>Зображення</h1>

        <p class="description">
            Завантажені зображення
        </p>

        <section class="gallery">

            <div class="image-card">
                <a href="/images/example-1.jpg">
                    <img src="/images/example-1.jpg" alt="Зображення 1">
                </a>

                <div class="image-name">
                    example-1.jpg
                </div>
            </div>

            <div class="image-card">
                <a href="/images/example-2.png">
                    <img src="/images/example-2.png" alt="Зображення 2">
                </a>

                <div class="image-name">
                    example-2.png
                </div>
            </div>

            <div class="image-card">
                <a href="/images/example-3.gif">
                    <img src="/images/example-3.gif" alt="Зображення 3">
                </a>

                <div class="image-name">
                    example-3.gif
                </div>
            </div>

        </section>

        <nav class="navigation">
            <a class="button" href="/">
                ← Головна
            </a>

            <a class="button" href="/upload">
                Завантажити зображення
            </a>
        </nav>

    </main>

</body>
</html>
