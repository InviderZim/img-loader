<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Images</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            color: #222;
        }

        .container {
            width: 100%;
            max-width: 1100px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        h1 {
            margin: 0 0 10px;
            text-align: center;
        }

        .description {
            margin: 0 0 30px;
            text-align: center;
            color: #666;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 20px;
        }

        .image-card {
            overflow: hidden;
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
        }

        .image-card a {
            display: block;
        }

        .image-card img {
            display: block;
            width: 100%;
            height: 220px;
            object-fit: cover;
        }

        .image-info {
            padding: 15px;
        }

        .image-name {
            margin-bottom: 12px;
            font-size: 15px;
            font-weight: 600;
            color: #222;
            word-break: break-word;
        }

        .image-meta {
            display: grid;
            gap: 6px;
            font-size: 13px;
            color: #666;
        }

        .image-meta span {
            display: flex;
            justify-content: space-between;
            gap: 10px;
        }

        .image-meta strong {
            color: #333;
        }

        .delete-button {
            display: block;
            width: calc(100% - 30px);
            margin: 0 15px 15px;
            padding: 10px;
            border: 0;
            border-radius: 6px;
            background: #d9534f;
            color: #ffffff;
            font-size: 14px;
            cursor: pointer;
        }

        .delete-button:hover {
            opacity: 0.85;
        }

        .pagination {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin-top: 30px;
        }

        .pagination a,
        .pagination .disabled {
            padding: 8px 16px;
            text-decoration: none;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        .pagination .disabled {
            color: #999;
            background: #eee;
        }

        .navigation {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 30px;
        }

        .button {
            display: inline-block;
            padding: 12px 20px;
            border-radius: 6px;
            background: #2b90cc;
            color: #ffffff;
            text-decoration: none;
        }

        .button:hover {
            opacity: 0.85;
        }
    </style>
</head>

<body>

    <main class="container">

        <h1>Images</h1>

        <p class="description">
            Uploaded images
        </p>

        <section class="gallery">

        </section>

        <nav class="navigation">
            <a class="button" href="/">
                ← Home
            </a>

            <a class="button" href="/upload">
                Upload Image
            </a>
        </nav>

    </main>

</body>
</html>
