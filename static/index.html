<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Image Server</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            color: #222;
        }

        .container {
            width: 100%;
            max-width: 600px;
            padding: 40px;
            text-align: center;
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
        }

        h1 {
            margin-top: 0;
            margin-bottom: 15px;
        }

        p {
            margin-bottom: 30px;
            color: #666;
        }

        .buttons {
            display: flex;
            justify-content: center;
            gap: 15px;
        }

        .button {
            display: inline-block;
            padding: 12px 20px;
            border-radius: 6px;
            background: #2b90cc;
            color: #ffffff;
            text-decoration: none;
            transition: opacity 0.2s;
        }

        .button:hover {
            opacity: 0.85;
        }
    </style>
</head>

<body>

    <main class="container">
        <h1>Image Server</h1>

        <p>Сервіс для завантаження та перегляду зображень.</p>

        <nav class="buttons">
            <a class="button" href="/upload">
                Завантажити зображення
            </a>

            <a class="button" href="/images/">
                Переглянути зображення
            </a>
        </nav>
    </main>

</body>
</html>
