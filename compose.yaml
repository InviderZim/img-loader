services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      IMAGE_DIR: /images
      LOG_FILE: /logs/app.log
    ports:
      - "8000:8000"
    volumes:
      - images:/images
      - logs:/logs
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - images:/images:ro
    depends_on:
      - app
    restart: unless-stopped

volumes:
  images:
  logs: